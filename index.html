<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>VideoFlow — Video Tools</title>

<style>
:root{
  --bg:#08090d;
  --card:#11131a;
  --line:#282c38;
  --text:#f7f7fb;
  --muted:#969baa;
  --purple:#8b5cf6;
  --green:#22c55e;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,#292344 0,#08090d 45%);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}

.wrap{
  width:min(920px,100%);
  margin:auto;
  padding:25px 15px 35px;
}

.top{
  text-align:center;
  padding:25px 0;
}

.logo{
  width:66px;
  height:66px;
  margin:auto;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ff0050,#8b5cf6 52%,#00f2ea);
  font-size:30px;
  font-weight:900;
  box-shadow:0 15px 40px #0008;
}

h1{
  font-size:35px;
  margin:17px 0 7px;
  letter-spacing:-1px;
}

.lead{
  margin:0;
  color:var(--muted);
}

.card{
  background:#11131aee;
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 20px 60px #0007;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:22px;
}

.tab{
  border:1px solid var(--line);
  background:#0c0e14;
  color:var(--muted);
  padding:14px 10px;
  border-radius:13px;
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  color:white;
  background:#211b38;
  border-color:#704fd0;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:9px;
}

.row{
  display:flex;
  gap:10px;
}

input{
  min-width:0;
  flex:1;
  border:1px solid #303542;
  background:#0a0c11;
  color:white;
  border-radius:13px;
  padding:15px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px #8b5cf622;
}

.main{
  border:0;
  border-radius:13px;
  padding:0 20px;
  min-width:135px;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:white;
  font-weight:900;
  cursor:pointer;
}

.main:disabled{
  opacity:.6;
}

.status{
  min-height:25px;
  margin-top:14px;
  color:var(--muted);
  font-size:14px;
}

.success{
  color:#6ee7a0;
}

.error{
  color:#ff8d9d;
}

.result{
  margin-top:10px;
  border:1px solid var(--line);
  background:#0b0d13;
  border-radius:17px;
  padding:17px;
}

.result-title{
  font-weight:800;
  font-size:17px;
}

.small{
  color:var(--muted);
  font-size:13px;
  margin-top:7px;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:15px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:11px;
  text-decoration:none;
  font-weight:900;
  cursor:pointer;
  border:0;
}

.download{
  background:var(--green);
  color:#06110a;
}

.open,
.copy{
  background:#242834;
  color:white;
}

.preview{
  width:100%;
  max-height:420px;
  margin-top:14px;
  border-radius:13px;
  background:#05060a;
}

.thumb{
  width:100%;
  border-radius:13px;
  margin-top:14px;
  display:block;
}

.hint{
  color:#747987;
  font-size:12px;
  line-height:1.5;
  margin-top:15px;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:13px;
}

.feature{
  border:1px solid var(--line);
  background:#0e1016;
  border-radius:15px;
  padding:14px;
  text-align:center;
  color:#a9adba;
  font-size:12px;
}

.feature b{
  display:block;
  color:white;
  margin-bottom:4px;
  font-size:13px;
}

.footer{
  text-align:center;
  color:#626774;
  font-size:12px;
  padding-top:24px;
}

@media(max-width:600px){
  .wrap{
    padding:16px 12px 28px;
  }

  h1{
    font-size:29px;
  }

  .row{
    flex-direction:column;
  }

  .main{
    min-height:48px;
  }

  .features{
    grid-template-columns:1fr;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="top">
  <div class="logo">▶</div>
  <h1>VideoFlow</h1>
  <p class="lead">Fast, clean and simple video tools</p>
</header>

<main class="card">

<div class="tabs">
  <button class="tab active" id="ttab">
    TikTok Downloader
  </button>

  <button class="tab" id="ytab">
    YouTube Thumbnail
  </button>
</div>

<section id="tpanel">

<label for="turl">
  TikTok video link
</label>

<div class="row">

<input
  id="turl"
  type="url"
  placeholder="Paste your TikTok link here…"
  autocomplete="off"
>

<button class="main" id="tbtn">
  Get Video
</button>

</div>

<div id="tstatus" class="status"></div>

<div id="tresult"></div>

<div class="hint">
  Paste a public TikTok video URL and tap Get Video.
</div>

</section>


<section id="ypanel" style="display:none">

<label for="yurl">
  YouTube video link
</label>

<div class="row">

<input
  id="yurl"
  type="url"
  placeholder="https://youtube.com/watch?v=..."
  autocomplete="off"
>

<button class="main" id="ybtn">
  Get Thumbnail
</button>

</div>

<div id="ystatus" class="status"></div>

<div id="yresult"></div>

</section>

</main>


<div class="features">

<div class="feature">
<b>⚡ Fast</b>
Quick API response
</div>

<div class="feature">
<b>📱 Mobile</b>
Built for phones
</div>

<div class="feature">
<b>🔒 Simple</b>
No account required
</div>

</div>


<footer class="footer">
VideoFlow • Use content you have permission to download.
</footer>

</div>


<script>

const API = location.origin;

const $ = id => document.getElementById(id);


/* Tabs */

$("ttab").onclick = () => switchTab(true);

$("ytab").onclick = () => switchTab(false);

function switchTab(tiktok){

  $("ttab").classList.toggle("active",tiktok);

  $("ytab").classList.toggle("active",!tiktok);

  $("tpanel").style.display =
    tiktok ? "" : "none";

  $("ypanel").style.display =
    tiktok ? "none" : "";
}


/* TikTok */

$("tbtn").onclick = async () => {

  const url = $("turl").value.trim();

  $("tresult").innerHTML = "";

  if(!url){

    setStatus(
      "tstatus",
      "Please paste a TikTok URL.",
      "error"
    );

    return;
  }

  setBusy("tbtn",true);

  setStatus(
    "tstatus",
    "Fetching video..."
  );

  try{

    const r = await fetch(
      API +
      "/api/tiktok?url=" +
      encodeURIComponent(url)
    );

    const d = await r.json();

    if(
      !r.ok ||
      d.status !== "success" ||
      !d.video
    ){

      throw new Error(
        d.error ||
        "Could not get the video."
      );
    }

    const downloadUrl =
      API +
      "/api/tiktok/download?video=" +
      encodeURIComponent(d.video);

    $("tresult").innerHTML = `

      <div class="result">

        <div class="result-title">
          Video ready ✓
        </div>

        <div class="small">
          ${escapeHtml(
            d.title || "TikTok video"
          )}
        </div>

        <video
          class="preview"
          controls
          playsinline
          src="${escapeAttr(d.video)}">
        </video>

        <div class="actions">

          <a
            class="btn download"
            href="${escapeAttr(downloadUrl)}">
            ⬇ Download MP4
          </a>

          <a
            class="btn open"
            href="${escapeAttr(d.video)}"
            target="_blank"
            rel="noopener">
            ▶ Open
          </a>

          <button
            class="btn copy"
            onclick="copyText(this.dataset.url)"
            data-url="${escapeAttr(d.video)}">
            Copy Link
          </button>

        </div>

      </div>

    `;

    setStatus(
      "tstatus",
      "Ready to download.",
      "success"
    );

  }catch(e){

    setStatus(
      "tstatus",
      e.message,
      "error"
    );

  }finally{

    setBusy("tbtn",false);

  }

};


/* YouTube Thumbnail */

$("ybtn").onclick = async () => {

  const url = $("yurl").value.trim();

  $("yresult").innerHTML = "";

  if(!url){

    setStatus(
      "ystatus",
      "Please paste a YouTube URL.",
      "error"
    );

    return;
  }

  setBusy("ybtn",true);

  setStatus(
    "ystatus",
    "Getting thumbnail..."
  );

  try{

    const r = await fetch(
      API +
      "/api/thumbnail?url=" +
      encodeURIComponent(url)
    );

    const d = await r.json();

    if(
      !r.ok ||
      d.status !== "success"
    ){

      throw new Error(
        d.error ||
        "Invalid YouTube URL."
      );
    }

    $("yresult").innerHTML = `

      <div class="result">

        <div class="result-title">
          Thumbnail ready ✓
        </div>

        <img
          class="thumb"
          src="${escapeAttr(d.thumbnail)}"
          alt="YouTube thumbnail"
        >

        <div class="actions">

          <a
            class="btn download"
            href="${escapeAttr(d.thumbnail)}"
            target="_blank"
            rel="noopener">
            Open Image
          </a>

          <button
            class="btn copy"
            onclick="copyText(this.dataset.url)"
            data-url="${escapeAttr(d.thumbnail)}">
            Copy Image URL
          </button>

        </div>

      </div>

    `;

    setStatus(
      "ystatus",
      "Ready.",
      "success"
    );

  }catch(e){

    setStatus(
      "ystatus",
      e.message,
      "error"
    );

  }finally{

    setBusy("ybtn",false);

  }

};


/* Helpers */

function setStatus(id,text,cls=""){

  $(id).innerHTML =
    cls
    ? `<span class="${cls}">
         ${escapeHtml(text)}
       </span>`
    : escapeHtml(text);
}


function setBusy(id,busy){

  $(id).disabled = busy;

  $(id).textContent =
    busy
    ? "Working..."
    : id === "tbtn"
      ? "Get Video"
      : "Get Thumbnail";
}


function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}


function escapeAttr(s){

  return escapeHtml(s);

}


async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    alert("Link copied");

  }catch(e){

    alert("Copy failed");

  }

}

</script>

</body>
</html>
