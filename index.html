<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VideoFlow</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 35px;
      background:
        linear-gradient(
          180deg,
          #211b38,
          #0b0b12
        );
    }

    .logo {
      width: 125px;
      height: 125px;
      margin: auto;
      border-radius: 35px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 55px;

      background:
        linear-gradient(
          135deg,
          #ff007a,
          #7545ff,
          #00cfff
        );
    }

    h1 {
      font-size: 50px;
      margin-top: 25px;
    }

    .subtitle {
      color: #aaa;
      font-size: 22px;
      margin-top: 15px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #111118;
      border: 1px solid #292936;
      border-radius: 30px;
      padding: 30px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 35px;
    }

    .tab {
      flex: 1;
      padding: 18px 10px;

      border-radius: 18px;

      background: #0c0c12;
      border: 1px solid #292936;

      color: #999;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    .tab.active {
      color: white;

      border: 2px solid #8b45ff;

      background: #201735;
    }

    label {
      display: block;

      font-size: 22px;
      font-weight: bold;

      margin-bottom: 15px;
    }

    input {
      width: 100%;

      padding: 22px;

      border-radius: 20px;

      border: 2px solid #292936;

      background: #09090e;

      color: white;

      font-size: 17px;

      outline: none;

      margin-bottom: 20px;
    }

    input:focus {
      border-color: #8b45ff;
    }

    .main-btn {
      width: 100%;

      padding: 22px;

      border: none;

      border-radius: 20px;

      background:
        linear-gradient(
          90deg,
          #7b35ed,
          #ad4df0
        );

      color: white;

      font-size: 21px;
      font-weight: bold;

      cursor: pointer;
    }

    .main-btn:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 20px;

      color: #ff809b;

      font-size: 17px;
    }

    .result {
      display: none;

      margin-top: 30px;

      border: 1px solid #292936;

      border-radius: 22px;

      padding: 15px;

      background: #0b0b11;
    }

    .result video {
      width: 100%;

      max-height: 600px;

      border-radius: 18px;

      background: black;
    }

    .buttons {
      display: flex;

      gap: 15px;

      margin-top: 20px;

      flex-wrap: wrap;
    }

    .download-btn,
    .open-btn,
    .copy-btn {

      border: none;

      border-radius: 18px;

      padding: 18px 25px;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      text-decoration: none;

      display: inline-block;
    }

    .download-btn {
      background: #20c968;

      color: #000;

      flex: 1;

      text-align: center;
    }

    .open-btn,
    .copy-btn {
      background: #242735;

      color: white;
    }

    .copy-btn {
      width: 100%;
    }

    .info {
      color: #888;

      margin-top: 25px;

      font-size: 16px;
    }

    .features {
      display: grid;

      gap: 18px;
    }

    .feature {
      text-align: center;

      padding: 25px;

      border: 1px solid #292936;

      border-radius: 22px;

      background: #101017;
    }

    .feature h2 {
      font-size: 22px;

      margin-bottom: 10px;
    }

    .feature p {
      color: #999;

      font-size: 17px;
    }

    @media (max-width: 600px) {

      .hero {
        padding-top: 45px;
      }

      .logo {
        width: 110px;
        height: 110px;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 18px;
      }

      .card {
        padding: 25px 18px;
      }

      .tabs {
        gap: 8px;
      }

      .tab {
        font-size: 15px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <div class="logo">
      ▶
    </div>

    <h1>
      VideoFlow
    </h1>

    <p class="subtitle">
      Fast, clean and simple video tools
    </p>

  </section>


  <main class="container">


    <!-- =========================
         MAIN CARD
    ========================= -->

    <div class="card">


      <!-- TABS -->

      <div class="tabs">

        <button
          class="tab active"
          id="tiktokTab"
        >
          TikTok Downloader
        </button>

        <button
          class="tab"
          id="youtubeTab"
        >
          YouTube Thumbnail
        </button>

      </div>


      <!-- =========================
           TIKTOK
      ========================= -->

      <div id="tiktokBox">

        <label>
          TikTok video link
        </label>

        <input
          type="text"
          id="tiktokUrl"
          placeholder="Paste your TikTok link here..."
        >

        <button
          class="main-btn"
          id="getVideoBtn"
          onclick="getTikTokVideo()"
        >
          Get Video
        </button>

        <div
          id="message"
          class="message"
        ></div>


        <!-- RESULT -->

        <div
          id="result"
          class="result"
        >

          <video
            id="videoPlayer"
            controls
            playsinline
          ></video>


          <div class="buttons">


            <!-- DOWNLOAD -->

            <a
              id="downloadBtn"
              class="download-btn"
              href="#"
            >
              ↓ Download MP4
            </a>


            <!-- OPEN -->

            <a
              id="openBtn"
              class="open-btn"
              href="#"
              target="_blank"
            >
              ▶ Open
            </a>


            <!-- COPY -->

            <button
              class="copy-btn"
              onclick="copyVideoLink()"
            >
              Copy Link
            </button>


          </div>

        </div>


        <p class="info">
          Paste a public TikTok video URL and tap Get Video.
        </p>

      </div>


      <!-- =========================
           YOUTUBE
      ========================= -->

      <div
        id="youtubeBox"
        style="display:none;"
      >

        <label>
          YouTube video link
        </label>

        <input
          type="text"
          id="youtubeUrl"
          placeholder="Paste YouTube link here..."
        >

        <button
          class="main-btn"
          onclick="getYouTubeThumbnail()"
        >
          Get Thumbnail
        </button>


        <div
          id="youtubeResult"
          class="result"
        >

          <img
            id="thumbnail"
            style="
              width:100%;
              border-radius:18px;
              display:block;
            "
          >


          <div class="buttons">

            <a
              id="thumbnailDownload"
              class="download-btn"
              href="#"
              target="_blank"
            >
              ↓ Download Thumbnail
            </a>

            <a
              id="thumbnailOpen"
              class="open-btn"
              href="#"
              target="_blank"
            >
              ▶ Open
            </a>

          </div>

        </div>


        <p class="info">
          Paste a YouTube video URL to get its thumbnail.
        </p>

      </div>


    </div>


    <!-- FEATURES -->

    <div class="features">

      <div class="feature">

        <h2>
          ⚡ Fast
        </h2>

        <p>
          Quick API response
        </p>

      </div>


      <div class="feature">

        <h2>
          📱 Mobile
        </h2>

        <p>
          Built for phones
        </p>

      </div>


      <div class="feature">

        <h2>
          🔒 Simple
        </h2>

        <p>
          No account required
        </p>

      </div>

    </div>


  </main>


<script>


/* =========================
   TABS
========================= */

const tiktokTab =
  document.getElementById("tiktokTab");

const youtubeTab =
  document.getElementById("youtubeTab");

const tiktokBox =
  document.getElementById("tiktokBox");

const youtubeBox =
  document.getElementById("youtubeBox");


tiktokTab.onclick = function () {

  tiktokTab.classList.add("active");

  youtubeTab.classList.remove("active");

  tiktokBox.style.display = "block";

  youtubeBox.style.display = "none";

};


youtubeTab.onclick = function () {

  youtubeTab.classList.add("active");

  tiktokTab.classList.remove("active");

  youtubeBox.style.display = "block";

  tiktokBox.style.display = "none";

};


/* =========================
   TIKTOK
========================= */

async function getTikTokVideo() {

  const input =
    document.getElementById("tiktokUrl");

  const message =
    document.getElementById("message");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("getVideoBtn");


  const url =
    input.value.trim();


  message.innerText = "";

  result.style.display = "none";


  if (!url) {

    message.innerText =
      "TikTok URL is required";

    return;

  }


  button.disabled = true;

  button.innerText = "Loading...";


  try {


    /* Backend ko POST request */

    const response =
      await fetch("/api/tiktok/download", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          url: url
        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Failed to fetch TikTok video"
      );

    }


    const videoUrl =
      data.video;


    if (!videoUrl) {

      throw new Error(
        "Video link not found"
      );

    }


    /* Video player */

    document
      .getElementById("videoPlayer")
      .src = videoUrl;


    /* Open button */

    document
      .getElementById("openBtn")
      .href = videoUrl;


    /*
      IMPORTANT:

      Download button backend ke
      download endpoint par jayega.

      Is se browser video ko open
      karne ke bajaye download karega.
    */

    const downloadUrl =
      "/api/tiktok/download?url=" +
      encodeURIComponent(url) +
      "&download=1";


    document
      .getElementById("downloadBtn")
      .href = downloadUrl;


    result.style.display =
      "block";


  } catch (error) {

    console.error(error);

    message.innerText =
      error.message ||
      "Failed to fetch TikTok video";

  }


  button.disabled = false;

  button.innerText =
    "Get Video";

}


/* =========================
   COPY VIDEO LINK
========================= */

async function copyVideoLink() {

  const link =
    document.getElementById("openBtn").href;


  try {

    await navigator.clipboard.writeText(link);

    alert("Video link copied!");

  } catch (error) {

    alert("Could not copy link");

  }

}


/* =========================
   YOUTUBE THUMBNAIL
========================= */

async function getYouTubeThumbnail() {

  const url =
    document
      .getElementById("youtubeUrl")
      .value
      .trim();


  const result =
    document.getElementById("youtubeResult");


  const thumbnail =
    document.getElementById("thumbnail");


  const download =
    document.getElementById("thumbnailDownload");


  const open =
    document.getElementById("thumbnailOpen");


  if (!url) {

    alert(
      "YouTube URL is required"
    );

    return;

  }


  try {


    const response =
      await fetch(
        "/api/thumbnail?url=" +
        encodeURIComponent(url)
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Failed to get thumbnail"
      );

    }


    const imageUrl =
      data.thumbnail;


    thumbnail.src =
      imageUrl;


    download.href =
      imageUrl;


    open.href =
      imageUrl;


    result.style.display =
      "block";


  } catch (error) {

    alert(
      error.message ||
      "Failed to get thumbnail"
    );

  }

}


</script>


</body>

</html>
